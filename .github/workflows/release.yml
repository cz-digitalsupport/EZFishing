name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and attach to release
        uses: BigWigsMods/packager@master
        env:
          # Nur GITHUB_OAUTH gesetzt -> Zip landet am GitHub-Release.
          # CurseForge/WoWInterface/Wago werden mangels Token automatisch uebersprungen.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
